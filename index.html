<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade - Olho no Tempo</title>
    <!-- Bootstrap CSS e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0e14;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #121721;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #21262d;
            border-right: 1px solid #21262d;
            position: relative;
        }
        .header-top {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-custom {
            background-color: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 12px;
        }
        .btn-custom-action {
            background-color: #2d3748;
            color: #90cdf4;
            border: none;
            font-size: 0.85rem;
        }
        .btn-custom-action:hover {
            background-color: #4a5568;
            color: #fff;
        }
        .nav-bottom {
            position: sticky;
            bottom: 0;
            background-color: #121721;
            border-top: 1px solid #21262d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item-btn {
            color: #718096;
            text-decoration: none;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item-btn.active {
            color: #3182ce;
        }
        .preview-box {
            position: relative;
            display: inline-block;
        }
        .btn-remove-preview {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Cabeçalho -->
    <div class="header-top">
        <h3 class="fw-bold mb-0">Comunidade</h3>
        <div>
            <i class="bi bi-search fs-5 me-3"></i>
            <i class="bi bi-bell fs-5"></i>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="p-3 flex-grow-1">
        
        <!-- Formulário de Nova Ocorrência -->
        <div class="card card-custom p-3 mb-4">
            <form id="ocorrencia-form">
                <input type="text" id="texto-input" class="form-control bg-transparent text-light border-secondary mb-3" placeholder="O que está acontecendo na sua região?">
                
                <!-- Pré-visualização da Imagem Anexada -->
                <div id="preview-container" class="mb-3 d-none">
                    <div class="preview-box">
                        <img id="preview-img" src="" class="rounded" style="max-height: 150px; max-width: 100%; object-fit: cover;">
                        <button type="button" id="btn-remover-foto" class="btn-remove-preview">&times;</button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex gap-2">
                        <!-- Input de Arquivo -->
                        <label for="upload-foto" class="btn btn-custom-action btn-sm">
                            <i class="bi bi-camera me-1"></i> Câmera
                        </label>
                        <input type="file" id="upload-foto" accept="image/*" class="d-none">

                        <!-- Seletor de Tipo de Alerta -->
                        <select id="tipo-alerta" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: 130px;">
                            <option value="Alagamento">Alagamento</option>
                            <option value="Árvore Caída">Árvore Caída</option>
                            <option value="Acidente">Acidente</option>
                            <option value="Alerta">Alerta Geral</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary btn-sm px-3">Publicar</button>
                </div>
            </form>
        </div>

        <!-- Feed de Ocorrências -->
        <div id="feed-container">
            
            <!-- Post de Exemplo 1 -->
            <div class="card card-custom p-3 mb-3">
                <div class="d-flex align-items-center mb-2">
                    <div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px;">
                        LV
                    </div>
                    <div>
                        <h6 class="mb-0 fw-bold text-light">Lucas Vieira</h6>
                        <small class="text-secondary">Av. Mascarenhas de Moraes • Há 15 min</small>
                    </div>
                </div>
                <div><span class="badge bg-danger mb-2">Alagamento</span></div>
                <p class="card-text text-light mb-2">Muita água acumulada na via de acesso, carros pequenos estão com dificuldade para passar. Evitem a região!</p>
                <div class="d-flex justify-content-around border-top border-secondary pt-2 mt-2 text-secondary">
                    <button type="button" class="btn btn-sm text-secondary text-decoration-none btn-curtir" aria-pressed="false"><i class="bi bi-heart me-1"></i> Curtir</button>
                    <button type="button" class="btn btn-sm text-secondary text-decoration-none btn-comentar"><i class="bi bi-chat me-1"></i> Comentar</button>
                    <button class="btn btn-sm text-secondary text-decoration-none"><i class="bi bi-share me-1"></i> Compartilhar</button>
                </div>
                <div class="comentarios d-none mt-2">
                    <div class="lista-comentarios small mb-2"></div>
                    <form class="form-comentario d-flex gap-2">
                        <input type="text" class="form-control form-control-sm bg-transparent text-light border-secondary" placeholder="Escreva um comentário..." aria-label="Escreva um comentário">
                        <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Navegação Inferior -->
    <div class="nav-bottom">
        <a href="#" class="nav-item-btn"><i class="bi bi-house-door fs-5"></i>Início</a>
        <a href="#" class="nav-item-btn"><i class="bi bi-map fs-5"></i>Mapa</a>
        <a href="#" class="nav-item-btn"><i class="bi bi-shield-exclamation fs-5"></i>Emergência</a>
        <a href="#" class="nav-item-btn active"><i class="bi bi-people-fill fs-5"></i>Comunidade</a>
    </div>
</div>

<!-- Lógica de Funcionamento (JavaScript) -->
<script>
    let fotoBase64 = "";

    const uploadInput = document.getElementById('upload-foto');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const btnRemoverFoto = document.getElementById('btn-remover-foto');
    const ocorrenciaForm = document.getElementById('ocorrencia-form');
    const feedContainer = document.getElementById('feed-container');

    feedContainer.addEventListener('click', function(e) {
        const btnCurtir = e.target.closest('.btn-curtir');
        if (btnCurtir) {
            const curtiu = btnCurtir.getAttribute('aria-pressed') === 'true';
            btnCurtir.setAttribute('aria-pressed', String(!curtiu));
            btnCurtir.classList.toggle('text-danger', !curtiu);
            btnCurtir.classList.toggle('text-secondary', curtiu);
            btnCurtir.innerHTML = curtiu
                ? '<i class="bi bi-heart me-1"></i> Curtir'
                : '<i class="bi bi-heart-fill me-1"></i> Curtido';
            return;
        }

        const btnComentar = e.target.closest('.btn-comentar');
        if (btnComentar) {
            const comentarios = btnComentar.closest('.card').querySelector('.comentarios');
            comentarios.classList.toggle('d-none');
            if (!comentarios.classList.contains('d-none')) {
                comentarios.querySelector('input').focus();
            }
        }
    });

    feedContainer.addEventListener('submit', function(e) {
        if (!e.target.matches('.form-comentario')) return;
        e.preventDefault();

        const input = e.target.querySelector('input');
        const textoComentario = input.value.trim();
        if (!textoComentario) return;

        const comentario = document.createElement('p');
        comentario.className = 'mb-1 text-light';
        comentario.textContent = textoComentario;
        e.target.closest('.comentarios').querySelector('.lista-comentarios').append(comentario);
        input.value = '';
    });

    // 1. Carregar a foto e exibir o preview
    uploadInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64 = e.target.result;
                previewImg.src = fotoBase64;
                previewContainer.classList.remove('d-none');
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. Remover foto selecionada
    btnRemoverFoto.addEventListener('click', function() {
        fotoBase64 = "";
        uploadInput.value = "";
        previewContainer.classList.add('d-none');
    });

    // 3. Publicar ocorrência no Feed
    ocorrenciaForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const textoInput = document.getElementById('texto-input');
        const tipoAlerta = document.getElementById('tipo-alerta').value;
        const texto = textoInput.value.trim();

        if (!texto && !fotoBase64) {
            alert('Digite uma mensagem ou selecione uma foto!');
            return;
        }

        // Definir cor da Badge de acordo com o tipo
        let badgeClass = 'bg-info';
        if (tipoAlerta === 'Alagamento') badgeClass = 'bg-danger';
        if (tipoAlerta === 'Árvore Caída') badgeClass = 'bg-success';
        if (tipoAlerta === 'Acidente') badgeClass = 'bg-warning text-dark';

        // Elemento da imagem no post (se houver)
        let imgHtml = '';
        if (fotoBase64) {
            imgHtml = `<img src="${fotoBase64}" class="img-fluid rounded mb-2 w-100" style="max-height: 250px; object-fit: cover;">`;
        }

        // Criar o Card da Ocorrência
        const novoPost = document.createElement('div');
        novoPost.className = 'card card-custom p-3 mb-3';
        novoPost.innerHTML = `
            <div class="d-flex align-items-center mb-2">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px; font-weight: bold;">
                    VC
                </div>
                <div>
                    <h6 class="mb-0 fw-bold text-light">Você</h6>
                    <small class="text-secondary">Sua localização • Agora mesmo</small>
                </div>
            </div>
            <div><span class="badge ${badgeClass} mb-2"></span></div>
            ${texto ? '<p class="card-text text-light mb-2"></p>' : ''}
            ${imgHtml}
            <div class="d-flex justify-content-around border-top border-secondary pt-2 mt-2 text-secondary">
                <button type="button" class="btn btn-sm text-secondary text-decoration-none btn-curtir" aria-pressed="false"><i class="bi bi-heart me-1"></i> Curtir</button>
                <button type="button" class="btn btn-sm text-secondary text-decoration-none btn-comentar"><i class="bi bi-chat me-1"></i> Comentar</button>
                <button class="btn btn-sm text-secondary text-decoration-none"><i class="bi bi-share me-1"></i> Compartilhar</button>
            </div>
            <div class="comentarios d-none mt-2">
                <div class="lista-comentarios small mb-2"></div>
                <form class="form-comentario d-flex gap-2">
                    <input type="text" class="form-control form-control-sm bg-transparent text-light border-secondary" placeholder="Escreva um comentário..." aria-label="Escreva um comentário">
                    <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
                </form>
            </div>
        `;
        novoPost.querySelector('.badge').textContent = tipoAlerta;
        const textoPost = novoPost.querySelector('.card-text');
        if (textoPost) textoPost.textContent = texto;

        // Adicionar o post no topo do feed
        feedContainer.prepend(novoPost);

        // Limpar os campos
        textoInput.value = '';
        uploadInput.value = '';
        fotoBase64 = '';
        previewContainer.classList.add('d-none');
    });
</script>

</body>
</html>
